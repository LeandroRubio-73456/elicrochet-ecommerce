sonar.projectKey=LeandroRubio-73456_elicrochet-ecommerce
sonar.organization=leandrorubio-73456

# Encoding
sonar.sourceEncoding=UTF-8

# Rutas
sonar.sources=app,resources/views
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,public/**,resources/css/**,resources/js/**

# Cobertura (Esto conecta Sonar con lo que generas en PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-report.xml

# Falsos positivos: el analizador de HTML revisa cada archivo Blade como un
# documento aislado y no sigue @include ni la composición de componentes
# (<x-componente>), así que marca como "faltante" contenido que en realidad
# viene de otro archivo.
sonar.issue.ignore.multicriteria=e1,e2
# back-layout.blade.php sí tiene <title>: lo inyecta layouts/head-page-meta.blade.php vía @include.
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=resources/views/layouts/back-layout.blade.php
# components/text-input.blade.php es el <x-text-input> de Breeze: el id lo
# pasa quien lo usa (ver resources/views/auth/confirm-password.blade.php).
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=resources/views/components/text-input.blade.php